# Istruzioni:
# Copia il contenuto del blocco qui sotto in:
#   Plesk → Siti web e domini → Apache & nginx settings
#   → "Additional nginx directives" (campo in fondo alla pagina)
#
# Adatta il path /var/www/vhosts/... al tuo percorso reale.
# ---------------------------------------------------------------

# Proxy verso Gunicorn per API e download
location /api/ {
    proxy_pass         http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /download/ {
    proxy_pass         http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;  # timeout alto per file grandi
    proxy_buffering    off;   # streaming file CSV grandi
}

# Frontend Vue (build statica)
location / {
    root  /var/www/vhosts/TUODOMINIO/site/frontend/dist;
    index index.html;
    try_files $uri $uri/ /index.html;  # necessario per Vue Router
}
