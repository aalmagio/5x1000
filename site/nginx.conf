# Configurazione nginx per Dati 5×1000
# Da incollare in Plesk → Sito → Impostazioni Apache & nginx → Direttive aggiuntive nginx
#
# Document root: /var/www/vhosts/almagioni.com/5x1000.almagioni.com/public
#
# IMPORTANTE: Plesk gestisce PHP-FPM automaticamente.
# Questa config gestisce solo:
#   1. Il routing SPA (Vue3 history mode)
#   2. I file statici (assets/)
#   3. api.php (già gestito da Plesk/PHP-FPM)

# Serve file statici direttamente
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# api.php viene gestito normalmente da PHP-FPM di Plesk
# nessuna regola speciale necessaria

# SPA routing: tutto il resto → index.html
location / {
    try_files $uri $uri/ /index.html;
}
