# Configurazione nginx aggiuntiva per Dati 5×1000
# Da incollare in Plesk → Sito web → Impostazioni Apache & nginx
#     → sezione "Direttive nginx aggiuntive" (non FastCGI)
#
# NON includere un blocco location / perché Plesk ne genera già uno.
# Il SPA routing viene gestito tramite error_page + named location.

# Cache aggressiva per gli asset buildati (hash nel nome file)
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Download: /download/{tipo}/{anno|completo} → PHP handler
# Gestisce csv/xlsx/report sia per singolo anno che per dataset completo
location ~ ^/download/(csv|xlsx|report)/(.+)$ {
    rewrite ^/download/(csv|xlsx|report)/(.+)$ /api.php?action=download&tipo=$1&anno=$2 last;
}

# SPA routing: qualsiasi percorso non trovato → index.html
# Esclude api.php (gestito da PHP-FPM di Plesk) e /assets/
error_page 404 = @spa_fallback;
location @spa_fallback {
    internal;
    try_files /index.html =404;
}
