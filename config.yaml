# --- Pipeline (pipeline.py) ---
pipeline:
  input_categorie: "categorie.xlsx"   # File Excel con link alle pagine delle categorie
  # sheet_id: "1ABC..."              # ID del Google Sheet (decommentare e valorizzare)
  step_timeouts:
    download:   7200   # secondi — download elenco completo AdE (può essere lento)
    categorie:  7200   # secondi — download per categoria
    etl:        3600   # secondi — normalizzazione e merge
    report:     1800   # secondi — generazione report Excel
    gsheets:    1800   # secondi — upload Google Sheets

# --- ETL (etl.py) ---
etl:
  chunk_size: 50000          # Righe per chunk nella lettura CSV per l'export Excel

# --- Formattazione Excel ---
# Usata sia da cinque_per_mille.py (conversione PDF/CSV) che da etl.py (export normalizzato)
excel:
  header_font: "Arial"
  header_size: 10
  header_bg: "#2F5496"       # Colore sfondo intestazione (blu scuro)
  header_fg: "#FFFFFF"       # Colore testo intestazione (bianco)
  data_font: "Arial"
  data_size_download: 10     # Dimensione font dati in cinque_per_mille.py
  data_size_etl: 9           # Dimensione font dati in etl.py
  alt_row_bg: "#EEF2FF"      # Colore sfondo righe alternate
  border_color: "#D9D9D9"    # Colore bordi celle
  max_col_width: 40          # Larghezza massima colonne (caratteri)
