# ============================================================================
# 5 per Mille — Configurazione
# ============================================================================
# Modifica questi valori senza toccare il codice Python.
# Se questo file non esiste o una chiave manca, lo script usa i valori
# di default definiti nel codice.
# ============================================================================

# --- Percorsi (relativi alla cartella root del progetto) ---
percorsi:
  dati: "Dati"              # Cartella con i file dati_XXXX.xlsx
  runts: "Runts"             # Cartella con il file RUNTS scaricato manualmente
  log: "log"                 # Cartella per i file di log

# --- Download ---
download:
  timeout_pagina: 60         # Secondi di attesa per le pagine web
  timeout_file: 120          # Secondi di attesa per il download dei file
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

